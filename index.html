<style>

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #123FCE 0%, #123FCE 30%, #F4F8F6 30%, #F4F8F6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;

  .card {
    width: 100%;

    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 18px 40px rgba(18, 63, 206, 0.18);
    overflow: hidden;
  }
  .header {
    background: #ffffff;
    padding: 30px 28px 18px 28px;
    text-align: center;
  }
  .header img { width: 168px; height: auto; display: block; margin: 0 auto; }
  .body { padding: 28px 24px 30px 24px; }
  .ask {
    text-align: center;
    color: #1e2b26;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 22px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-decoration: none;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { transform: scale(0.98); }
  .btn-icon {

  }
  .btn-text .t { font-weight: 700; font-size: 15.5px; }
  .btn-text .d {

    border: 1.5px solid #0F8A3C;
  }
  .btn-support .btn-icon { background: #0F8A3C; }
  .btn-support .t { color: #0F8A3C; }
  .btn-support .d { color: #3a4a44; }

  .btn-suggest {
    background: #EEF2FF;
    border: 1.5px solid #123FCE;
  }
  .btn-suggest .btn-icon { background: #123FCE; }
  .btn-suggest .t { color: #123FCE; }
  .btn-suggest .d { color: #3a4a44; }

  .footer {
    text-align: center;
    padding: 16px 20px 26px 20px;
    font-family: 'Roboto Condensed', sans-serif;
    color: #8a978f;
    font-size: 12px;
