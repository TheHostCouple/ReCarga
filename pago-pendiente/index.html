<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReCarga! · Pago pendiente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(180deg, #123FCE 0%, #123FCE 30%, #F4F8F6 30%, #F4F8F6 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 420px; background: #fff; border-radius: 20px;
    box-shadow: 0 18px 40px rgba(18,63,206,.18); overflow: hidden; text-align: center; }
  .header { padding: 30px 28px 6px; }
  .header img { width: 168px; height: auto; display: block; margin: 0 auto; }
  .body { padding: 14px 26px 30px; }
  .icon { width: 72px; height: 72px; border-radius: 50%; margin: 10px auto 16px;
    display: flex; align-items: center; justify-content: center; background: #D9713C; }
  h1 { font-size: 22px; font-weight: 800; color: #D9713C; margin-bottom: 10px; }
  p { font-family: 'Roboto Condensed', sans-serif; font-size: 16px; color: #3a4a44; line-height: 1.45; }
  .tip { margin-top: 18px; background: #F4F8F6; border-radius: 12px; padding: 12px 14px;
    font-family: 'Roboto Condensed', sans-serif; font-size: 14px; color: #3a4a44; }
  .btn { display: inline-block; margin-top: 20px; text-decoration: none; background: #0F8A3C; color: #fff;
    font-weight: 700; font-size: 15px; padding: 13px 22px; border-radius: 12px; }
  .footer { padding: 0 20px 24px; font-family: 'Roboto Condensed', sans-serif; color: #8a978f; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="header"><img src="/logo-recarga.png" alt="ReCarga!"></div>
    <div class="body">
      <div class="icon"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <h1>Pago en proceso</h1>
      <p>Tu pago aún no se confirma. Si se aprueba, la máquina dispensará tu producto automáticamente.</p>
      <div class="tip">Mantén tu envase bajo la boquilla unos minutos. Si pasa mucho rato sin novedades, escríbenos.</div>
      <a class="btn" href="https://wa.me/56930212843?text=Hola%20ReCarga%2C%20tuve%20un%20problema%20con%20un%20pago." target="_blank" rel="noopener">Escribirnos por WhatsApp</a>
    </div>
    <div class="footer">ReCarga! · Llena tu frasco, limpia tu huella.</div>
  </div>
</body>
</html>
