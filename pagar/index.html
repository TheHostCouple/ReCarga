<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReCarga! · Pagar y recargar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; min-height: 100vh; padding: 20px 16px 40px;
    background: linear-gradient(180deg, #123FCE 0%, #123FCE 22%, #F4F8F6 22%, #F4F8F6 100%); }
  .card { width: 100%; max-width: 440px; margin: 0 auto; background: #fff; border-radius: 20px;
    box-shadow: 0 18px 40px rgba(18,63,206,.18); overflow: hidden; }
  .header { padding: 22px 28px 4px; text-align: center; }
  .header img { width: 130px; height: auto; display: block; margin: 0 auto; }
  .body { padding: 10px 20px 26px; }
  h2 { font-size: 17px; font-weight: 800; color: #1e2b26; margin: 16px 0 10px; }
  h2 .n { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%;
    background:#123FCE; color:#fff; font-size:13px; margin-right:8px; }
  .prod { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
    border:1.5px solid #E4E9E6; border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-family:inherit; }
  .prod.sel { border-color:#0F8A3C; background:#EAF7EE; }
  .dot { width:34px; height:34px; border-radius:50%; flex-shrink:0; }
  .prod .nm { font-weight:700; font-size:14.5px; color:#1e2b26; }
  .prod .pr { font-family:'Roboto Condensed',sans-serif; font-size:13px; color:#5A6B64; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tab { flex:1; padding:11px 8px; border-radius:12px; border:1.5px solid #123FCE; background:#fff; color:#123FCE;
    font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .tab.sel { background:#123FCE; color:#fff; }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip { padding:12px 8px; border-radius:12px; border:1.5px solid #E4E9E6; background:#fff; cursor:pointer;
    font-family:inherit; text-align:center; }
  .chip.sel { border-color:#0F8A3C; background:#EAF7EE; }
  .chip .a { font-weight:800; font-size:17px; color:#1e2b26; }
  .chip .b { font-family:'Roboto Condensed',sans-serif; font-size:13px; color:#5A6B64; margin-top:2px; }
  .summary { margin-top:16px; background:#F4F8F6; border-radius:14px; padding:14px 16px; }
  .summary .row { display:flex; justify-content:space-between; font-family:'Roboto Condensed',sans-serif; font-size:15px; color:#3a4a44; margin:3px 0; }
  .summary .tot { font-family:'Poppins',sans-serif; font-weight:800; font-size:20px; color:#0F8A3C; margin-top:6px; }
  .pay { width:100%; margin-top:16px; padding:16px; border:0; border-radius:14px; background:#0F8A3C; color:#fff;
    font-family:inherit; font-weight:800; font-size:17px; cursor:pointer; }
  .pay:disabled { background:#B8C4BE; cursor:not-allowed; }
  .note { margin-top:12px; text-align:center; font-family:'Roboto Condensed',sans-serif; font-size:13px; color:#5A6B64; line-height:1.4; }
  #msg { margin-top:10px; text-align:center; font-family:'Roboto Condensed',sans-serif; font-size:14px; color:#D52B1E; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="header"><img src="/logo-recarga.png" alt="ReCarga!"></div>
  <div class="body">

    <h2><span class="n">1</span>Elige tu producto</h2>
    <div id="products"><p class="note">Cargando productos...</p></div>

    <div id="step2" class="hidden">
      <h2><span class="n">2</span>¿Cómo quieres recargar?</h2>
      <div class="tabs">
        <button class="tab sel" id="tabAmount" type="button">Por monto</button>
        <button class="tab" id="tabVolume" type="button">Por cantidad</button>
      </div>
      <div id="options" class="chips"></div>
    </div>

    <div id="summary" class="summary hidden">
      <div class="row"><span>Producto</span><span id="sProd"></span></div>
      <div class="row"><span>Cantidad aprox.</span><span id="sVol"></span></div>
      <div class="row tot"><span>Total</span><span id="sTot"></span></div>
    </div>

    <button id="payBtn" class="pay" type="button" disabled>Pagar con MercadoPago</button>
    <div id="msg"></div>
    <div class="note">Pago seguro con MercadoPago. Después de pagar, sigue las instrucciones en la pantalla de la máquina.</div>

  </div>
</div>

<script>
  // ====== EDITAR: pega tu clave pública (anon / publishable) de Supabase ======
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRieHVxY3VrY2FxdXVyYm5mbnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTA2ODIsImV4cCI6MjEwNjk4NjY4Mn0.YSdtXnICisyx1KGQdr7aXSa7MBPPtHBgxvDXu56-etw";
  // ===========================================================================
  const SUPABASE_URL  = "https://tbxuqcukcaquurbnfnpr.supabase.co";
  const FUNCTIONS_URL = SUPABASE_URL + "/functions/v1";

  // Mismos valores permitidos que en la función del servidor (el servidor los valida de nuevo).
  const AMOUNTS = [500, 1000, 1500, 2000];     // modo "por monto" (CLP)
  const VOLUMES = [500, 1000, 2000];            // modo "por cantidad" (ml)

  const COLORS = { omo:"#1E3A8A", quix:"#43A047", ariel:"#4FC3F7", suavizante:"#F7B8D2", limpiapisos:"#8E5FC7" };
  const MACHINE_ID = new URLSearchParams(location.search).get("m") || "recarga-01";

  let products = [], product = null, mode = "amount", option = null;

  const clp = n => "$" + Number(n).toLocaleString("es-CL");
  const volFromAmount = (a, p) => Math.round(a / p * 1000 / 10) * 10;      // ml
  const amountFromVol = (v, p) => Math.round(p * v / 1000 / 10) * 10;      // CLP
  const fmtVol = ml => ml >= 1000 ? (ml/1000).toString().replace(".", ",") + " L" : ml + " ml";

  async function loadProducts() {
    try {
      const r = await fetch(SUPABASE_URL + "/rest/v1/vending_prices?select=product_code,label,price_clp&order=product_code", {
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
      });
      if (!r.ok) throw new Error(r.status);
      products = await r.json();
      if (!products.length) throw new Error("vacío");
    } catch (e) {
      document.getElementById("products").innerHTML = '<p class="note">No pudimos cargar los productos. Recarga la página.</p>';
      return;
    }
    renderProducts();
  }

  function renderProducts() {
    const box = document.getElementById("products");
    box.innerHTML = "";
    products.forEach(p => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "prod" + (product && product.product_code === p.product_code ? " sel" : "");
      b.innerHTML = '<span class="dot" style="background:' + (COLORS[p.product_code] || "#999") + '"></span>' +
        '<span><div class="nm">' + p.label + '</div><div class="pr">' + clp(p.price_clp) + ' por litro</div></span>';
      b.onclick = () => { product = p; option = null; renderProducts(); renderOptions(); };
      box.appendChild(b);
    });
  }

  function renderOptions() {
    document.getElementById("step2").classList.toggle("hidden", !product);
    document.getElementById("tabAmount").classList.toggle("sel", mode === "amount");
    document.getElementById("tabVolume").classList.toggle("sel", mode === "volume");
    const box = document.getElementById("options");
    box.innerHTML = "";
    if (product) {
      const list = mode === "amount" ? AMOUNTS : VOLUMES;
      list.forEach(v => {
        const amount = mode === "amount" ? v : amountFromVol(v, product.price_clp);
        const ml = mode === "amount" ? volFromAmount(v, product.price_clp) : v;
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (option === v ? " sel" : "");
        b.innerHTML = mode === "amount"
          ? '<div class="a">' + clp(amount) + '</div><div class="b">≈ ' + fmtVol(ml) + '</div>'
          : '<div class="a">' + fmtVol(ml) + '</div><div class="b">' + clp(amount) + '</div>';
        b.onclick = () => { option = v; renderOptions(); };
        box.appendChild(b);
      });
    }
    renderSummary();
  }

  function renderSummary() {
    const ok = product && option !== null;
    document.getElementById("summary").classList.toggle("hidden", !ok);
    document.getElementById("payBtn").disabled = !ok;
    if (!ok) return;
    const amount = mode === "amount" ? option : amountFromVol(option, product.price_clp);
    const ml = mode === "amount" ? volFromAmount(option, product.price_clp) : option;
    document.getElementById("sProd").textContent = product.label;
    document.getElementById("sVol").textContent = "≈ " + fmtVol(ml);
    document.getElementById("sTot").textContent = clp(amount);
    document.getElementById("payBtn").textContent = "Pagar " + clp(amount) + " con MercadoPago";
  }

  document.getElementById("tabAmount").onclick = () => { mode = "amount"; option = null; renderOptions(); };
  document.getElementById("tabVolume").onclick = () => { mode = "volume"; option = null; renderOptions(); };

  document.getElementById("payBtn").onclick = async () => {
    const msg = document.getElementById("msg");
    const btn = document.getElementById("payBtn");
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Creando pago...";
    try {
      const body = { machine_id: MACHINE_ID, product_code: product.product_code, mode };
      if (mode === "amount") body.amount_clp = option; else body.volume_ml = option;
      const r = await fetch(FUNCTIONS_URL + "/create-payment-preference", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      if (!r.ok || !data.init_point) throw new Error(data.error || "Error al crear el pago");
      btn.textContent = "Redirigiendo a MercadoPago...";
      window.location.href = data.init_point;
    } catch (e) {
      msg.textContent = "No pudimos iniciar el pago. Inténtalo de nuevo o escríbenos por WhatsApp.";
      renderSummary();
    }
  };

  loadProducts();
</script>
</body>
</html>
