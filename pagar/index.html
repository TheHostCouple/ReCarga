<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReCarga! · Pagar y recargar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; min-height: 100vh; padding: 20px 16px 40px;
    background: linear-gradient(180deg, #123FCE 0%, #123FCE 22%, #F4F8F6 22%, #F4F8F6 100%); }
  .card { width: 100%; max-width: 440px; margin: 0 auto; background: #fff; border-radius: 20px;
    box-shadow: 0 18px 40px rgba(18,63,206,.18); overflow: hidden; }
  .header { padding: 22px 28px 4px; text-align: center; }
  .header img { width: 130px; height: auto; display: block; margin: 0 auto; }
  .body { padding: 10px 20px 26px; }
  h2 { font-size: 17px; font-weight: 800; color: #1e2b26; margin: 16px 0 10px; }
  h2 .n { display:inline-block; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%;
    background:#123FCE; color:#fff; font-size:13px; margin-right:8px; }
  .prod { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:#fff;
    border:1.5px solid #E4E9E6; border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; font-family:inherit; }
  .prod.sel { border-color:#0F8A3C; background:#EAF7EE; }
  .dot { width:34px; height:34px; border-radius:50%; flex-shrink:0; }
  .prod .nm { font-weight:700; font-size:14.5px; color:#1e2b26; }
  .prod .pr { font-family:'Roboto Condensed',sans-serif; font-size:13px; color:#5A6B64; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tab { flex:1; padding:11px 8px; border-radius:12px; border:1.5px solid #123FCE; background:#fff; color:#123FCE;
    font-weight:700; font-size:14px; cursor:pointer; font-family:inherit; }
  .tab.sel { background:#123FCE; color:#fff; }
  .chips { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .chip { padding:12px 8px; border-radius:12px; border:1.5px solid #E4E9E6; background:#fff; cursor:pointer;
    font-family:inherit; text-align:center; }
  .chip.sel { border-color:#0F8A3C; background:#EAF7EE; }
  .chip .a { font-weight:800; font-size:17px; color:#1e2b26; }
  .chip .b { font-family:'Roboto Condensed',sans-serif; font-size:13px; color:#5A6B64; margin-top:2px; }
  .summary { margin-top:16px; background:#F4F8F6; border-radius:14px; padding:14px 16px; }
  .summary .row { display:flex; justify-content:space-between; font-family:'Roboto Condensed',sans-serif; font-size:15px; color:#3a4a44; margin:3px 0; }
  .summary .tot { font-family:'Poppins',sans-serif; font-weight:800; font-size:20px; color:#0F8A3C; margin-top:6px; }
  .pay { width:100%; margin-top:16px; padding:16px; border:0; border-radius:14px; background:#0F8A3C; color:#fff;
    font-family:inherit; font-weight:800; font-size:17px; cursor:pointer; }
  .pay:disabled { background:#B8C4BE; cursor:not-allowed; }
  .note { margin-top:12px; text-align:center; font-family:'Roboto Condensed',sans-serif; font-size:13px; color:#5A6B64; line-height:1.4; }
  #msg { margin-top:10px; text-align:center; font-family:'Roboto Condensed',sans-serif; font-size:14px; color:#D52B1E; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="header"><img src="/logo-recarga.png" alt="ReCarga!"></div>
  <div class="body">

    <h2>¿Cuánto quieres recargar?</h2>
    <div id="options" class="chips"></div>
    <div id="customBox" class="hidden" style="margin-top:10px">
      <input id="customIn" type="number" inputmode="numeric" min="500" max="10000" step="100" placeholder="Ej: 3000"
        style="width:100%;padding:14px;border:1.5px solid #123FCE;border-radius:12px;font-size:17px;font-family:inherit">
      <div id="customHint" class="note">Entre $500 y $10.000, en múltiplos de $100.</div>
    </div>
    <p class="note" style="margin-top:10px">Tu saldo quedará en la pantalla de la máquina y podrás usarlo en el producto que prefieras.</p>

    <button id="payBtn" class="pay" type="button" disabled>Elige un monto</button>
    <div id="msg"></div>
    <div class="note">Pago seguro con MercadoPago. Después de pagar, tu saldo aparecerá en la pantalla de la máquina.</div>

  </div>
</div>

<script>
  // ====== EDITAR: pega tu clave pública (anon / publishable) de Supabase ======
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRieHVxY3VrY2FxdXVyYm5mbnByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0MTA2ODIsImV4cCI6MjEwNjk4NjY4Mn0.YSdtXnICisyx1KGQdr7aXSa7MBPPtHBgxvDXu56-etw";
  // ===========================================================================
  const SUPABASE_URL  = "https://tbxuqcukcaquurbnfnpr.supabase.co";
  const FUNCTIONS_URL = SUPABASE_URL + "/functions/v1";

  // Mismos valores permitidos que en la función del servidor (el servidor los valida de nuevo).
  const AMOUNTS = [1000, 2000, 5000];          // montos fijos (CLP)
  const MIN = 500, MAX = 10000, STEP = 100;    // monto libre
  const MACHINE_ID = new URLSearchParams(location.search).get("m") || "recarga-01";
  let option = null, custom = false;

  const clp = n => "$" + Number(n).toLocaleString("es-CL");

  function render() {
    const box = document.getElementById("options");
    box.innerHTML = "";
    AMOUNTS.forEach(v => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip" + (option === v ? " sel" : "");
      b.innerHTML = '<div class="a">' + clp(v) + '</div>';
      b.onclick = () => { option = v; custom = false; render(); };
      box.appendChild(b);
    });
    const o = document.createElement("button");
    o.type = "button";
    o.className = "chip" + (custom ? " sel" : "");
    o.innerHTML = '<div class="a">Otro monto</div>';
    o.onclick = () => { custom = true; option = null; render(); document.getElementById("customIn").focus(); };
    box.appendChild(o);
    document.getElementById("customBox").classList.toggle("hidden", !custom);
    const btn = document.getElementById("payBtn");
    btn.disabled = option === null;
    btn.textContent = option === null ? "Elige un monto" : "Pagar " + clp(option) + " con MercadoPago";
  }

  document.getElementById("customIn").addEventListener("input", e => {
    const v = Number(e.target.value);
    const ok = Number.isInteger(v) && v >= MIN && v <= MAX && v % STEP === 0;
    option = ok ? v : null;
    document.getElementById("customHint").style.color = (e.target.value && !ok) ? "#D52B1E" : "";
    const btn = document.getElementById("payBtn");
    btn.disabled = !ok;
    btn.textContent = ok ? "Pagar " + clp(v) + " con MercadoPago" : "Elige un monto";
  });

  document.getElementById("payBtn").onclick = async () => {
    const msg = document.getElementById("msg");
    const btn = document.getElementById("payBtn");
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Creando pago...";
    try {
      const r = await fetch(FUNCTIONS_URL + "/create-payment-preference", {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
        body: JSON.stringify({ machine_id: MACHINE_ID, amount_clp: option })
      });
      const data = await r.json();
      if (!r.ok || !data.init_point) throw new Error(data.error || "Error al crear el pago");
      btn.textContent = "Redirigiendo a MercadoPago...";
      window.location.href = data.init_point;
    } catch (e) {
      msg.textContent = "No pudimos iniciar el pago. Inténtalo de nuevo o escríbenos por WhatsApp.";
      render();
    }
  };

  render();
</script>
</body>
</html>
